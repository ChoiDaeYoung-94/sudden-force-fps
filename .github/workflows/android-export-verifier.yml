name: Android export verifier unit tests

on:
  pull_request:
    paths:
      - 'Tools/Android/**'
      - '.github/workflows/android-export-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'Tools/Android/**'
      - '.github/workflows/android-export-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout verifier sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: Tools/Android
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run verifier unit tests
        run: python -B -m unittest discover -s Tools/Android -p 'test_*.py' -v
