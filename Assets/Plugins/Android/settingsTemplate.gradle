pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        maven {
            // Unity builds under Library/Bee; exported projects can supply the source root.
            def sourceRoot = System.getenv('SUDDEN_FORCE_PROJECT_PATH')
            def projectRoot = sourceRoot ? new File(sourceRoot) : settingsDir
            def repositoryPath = 'Assets/GeneratedLocalRepo/GooglePlayGames/com.google.play.games/Editor/m2repository'
            while (projectRoot != null && !new File(projectRoot, repositoryPath).isDirectory()) {
                projectRoot = projectRoot.parentFile
            }
            if (projectRoot == null) {
                throw new GradleException('GPGS local repository missing; resolve dependencies or set SUDDEN_FORCE_PROJECT_PATH.')
            }
            url new File(projectRoot, repositoryPath).toURI() // Assets/GooglePlayGames/com.google.play.games/Editor/GooglePlayGamesPluginDependencies.xml:11
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
